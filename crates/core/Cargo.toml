[package]
name = "milanote-core"
version = "0.2.0"
edition = "2021"
authors = ["Antigravity & User"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "serde_json", "uuid", "chrono", "load_extension"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.13", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
directories = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json", "stream"] }
url = "2.5"
scraper = "0.22"
log = "0.4"
async-trait = "0.1"
bytes = { version = "1", features = ["serde"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "macros", "rt", "rt-multi-thread", "time", "net"] }
hex = "0.4"
flate2 = "1.0"
base64 = "0.22"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query"] }
tower-http = { version = "0.6", default-features = false, features = ["cors", "trace"] }
socket2 = "0.5"

[dev-dependencies]
tempfile = "3.16"
tokio = { version = "1", features = ["full"] }
