[package]
name = "milanote-core"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity & User"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "serde_json", "uuid", "chrono", "load_extension"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.13", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
directories = "5.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
url = "2.5"
scraper = "0.22"
log = "0.4"

[dev-dependencies]
tempfile = "3.16"
