[package]
name = "antigravity-milanote-tauri"
version = "0.2.0"
edition = "2021"
authors = ["Antigravity & User"]
build = "build.rs"

[lib]
name = "antigravity_milanote_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
milanote-core = { path = "../crates/core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.13", features = ["v4", "serde"] }
chrono = "0.4"
tokio = { version = "1", features = ["sync", "macros", "rt"] }
hex = "0.4"
base64 = "0.22"
log = "0.4"
tauri = { version = "2.0.0", features = ["custom-protocol"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-opener = "2.7.1"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
